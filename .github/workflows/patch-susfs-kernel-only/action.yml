          echo "b6e22a0dd9130e17a5eb1f33057af0097d8370c2afee391c0a93287ec4119d13  $ACTION_DIR/susfs-v230-to-v240.patch" | sha256sum -c -
          echo "d2287a0cf7082d1f156677e5d4e3e3fc1365cb9b0cba07fdb2075edd1c35f2ca  $ACTION_DIR/susfs-v230prio-to-v240.patch" | sha256sum -c -
          echo "6e284dd46d772d4cd839c49f05ad069eceb7ca2d480f8537decc53b104b63c27  $ACTION_DIR/susfs-v240-to-v240c.patch" | sha256sum -c -
          echo "::endgroup::"
          cd "$GITHUB_WORKSPACE/device_kernel"
          DEFCONFIG="arch/${KERNEL_ARCH}/configs/${DEFCONFIG_NAME}"

          fail() { echo "[-] $*"; exit 1; }

          echo "::group::[+] Pre-checks"
          [ -f fs/susfs.c ] && [ -f include/linux/susfs.h ] || fail "SUSFS is not integrated in this kernel (fs/susfs.c missing)."
          SUSFS_VER=$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | cut -d' ' -f3 | tr -d '"')
          echo "[+] SUSFS version in kernel: ${SUSFS_VER}"
          [ -f drivers/kernelsu/Kconfig ] || fail "KernelSU is not set up at drivers/kernelsu."
          [ -f "$DEFCONFIG" ] || fail "defconfig not found: $DEFCONFIG"
          command -v patch >/dev/null || fail "'patch' is not installed."
          if ! command -v python3 >/dev/null 2>&1; then
            echo "[+] Installing python3..."
            if command -v apt-get >/dev/null 2>&1; then apt-get install -y python3 >/dev/null
            elif command -v pacman >/dev/null 2>&1; then pacman -S --noconfirm python >/dev/null
            fi
            command -v python3 >/dev/null || fail "python3 is not available."
          fi
          HAS_PRIO=false
          grep -q "susfs_is_priority_uid_filtered" fs/susfs.c && HAS_PRIO=true
          UPGRADE=false
          case "$SUSFS_VER" in
            v2.3.0)
              UPGRADE=true
              if [ "$HAS_PRIO" = true ]; then KPATCH="$ACTION_DIR/susfs-v230prio-to-v240.patch"; echo "[+] Base: v2.3.0 + PRIORITY_UID_FILTER (older patch)."
              else KPATCH="$ACTION_DIR/susfs-v230-to-v240.patch"; echo "[+] Base: pristine v2.3.0."; fi
              ;;
            v2.4.0)
              [ "$HAS_PRIO" = true ] || fail "SUSFS is v2.4.0 but PRIORITY_UID_FILTER is missing (unexpected state)."
              echo "[+] Kernel is already SUSFS v2.4.0, kernel side skipped."
              ;;
            *) fail "Unsupported SUSFS version in kernel: ${SUSFS_VER} (this action handles v2.3.0 -> v2.4.0)." ;;
          esac
          echo "::endgroup::"

          echo "::group::[+] Kernel side (susfs.c/.h/_def.h, statfs.c, namei.c, namespace.c, ioprio.c, sys.c)"
          if [ "$UPGRADE" = true ]; then
            # -F0: no fuzz. Dry-run first so that a mismatch never leaves a half-patched tree.
            if ! patch -p1 -F0 --dry-run < "$KPATCH"; then
              fail "Kernel patch does not apply cleanly (the kernel source changed?). Nothing was modified."
            fi
            patch -p1 -F0 --no-backup-if-mismatch < "$KPATCH"
            echo "[+] Kernel side upgraded to SUSFS v2.4.0."
            echo "70d11343ee3f4a77071fcba2ee247027f87d8e97d613c69baa6c44547fdd2370  fs/susfs.c" | sha256sum -c -
            echo "1dbe8e9d31211bf07eacf5c28054b7f3bb27d034565b88f1ddff371c356c4dd6  include/linux/susfs.h" | sha256sum -c -
            echo "41716af01302f7343c4dc5e45bf90cb7ac4e5aed6652c3619a9f3df3e6465b58  include/linux/susfs_def.h" | sha256sum -c -
          fi

          # Sync with the newest susfs_patch_to_4.19.patch of JackA1ltman (still reports v2.4.0):
          # sus_path uid filter, kernel_read() compat (SUSFS_KERNEL_READ_NEW), cleaned hooks in namei.c/readdir.c and
          # (20 Nov 2026 update) sus_path flag set AND tested on i_state (previously tested on i_mapping->flags => hid nothing).
          # Markers = susfs_set_sus_path_uid_filter in susfs.h + test_bit(AS_FLAGS_SUS_PATH, &inode->i_state) in susfs.c.
          # Kept from the previous setup (NOT in upstream): the msleep(1500) in the priority worker and the empty *_RL log macros.
          if grep -q "susfs_set_sus_path_uid_filter" include/linux/susfs.h && grep -qF "test_bit(AS_FLAGS_SUS_PATH, &inode->i_state)" fs/susfs.c; then
            echo "[+] Kernel already has the newest SUSFS v2.4.0 sync, skipped."
          else
            SYNC_PATCH="$ACTION_DIR/susfs-v240-to-v240c.patch"
            if ! patch -p1 -F0 --dry-run < "$SYNC_PATCH"; then
              fail "Newest SUSFS sync patch does not apply cleanly (kernel is not the expected SUSFS v2.4.0 state, or it carries the older sync with sus_path tested on i_mapping->flags). Nothing was modified."
            fi
            patch -p1 -F0 --no-backup-if-mismatch < "$SYNC_PATCH"
            echo "[+] Synced with the newest susfs_patch_to_4.19.patch."
            echo "7d0e3e7ec7b9e5cbc79233a27e5494bc35f44d382761c566272b9b29ce9dd837  fs/susfs.c" | sha256sum -c -
            echo "763a502a37c3ffa3807ba2cab46af31807b8bd87cccb86d12e552d0532a96573  include/linux/susfs.h" | sha256sum -c -
            echo "ae28964527e6fb64ca63e2a98f96acbdb8fd4bbd1350ded71ea6d491f7375158  include/linux/susfs_def.h" | sha256sum -c -
          fi
          echo "::endgroup::"

          echo "::group::[+] defconfig"
          # An earlier (buggy) step may have appended the bare line "CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER" (no "=y"): remove it.
          sed -i '/^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER$/d' "$DEFCONFIG"
          grep -q '^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y$' "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y" >> "$DEFCONFIG"
          grep -n "PRIORITY_UID_FILTER" "$DEFCONFIG"
          echo "::endgroup::"

          echo "::group::[+] Final verification"
          chk() { grep -qF -- "$2" "$1" || fail "verification failed: '$2' not found in $1"; echo "  ok: $1"; }
          chk include/linux/susfs.h                        '#define SUSFS_VERSION "v2.4.0"'
          chk fs/susfs.c                                   "susfs_is_priority_uid_filtered"
          chk fs/susfs.c                                   "CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER"
          chk fs/susfs.c                                   "susfs_add_sus_avd_allowed_by_type"
          chk fs/susfs.c                                   "calculate_f_flags_wrapper"
          chk include/linux/susfs.h                        "susfs_set_priority_uid_filter"
          chk include/linux/susfs_def.h                    "CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030"
          chk fs/statfs.c                                  "statfs_by_dentry_wrapper"
          chk fs/statfs.c                                  "susfs_statfs_by_dentry(path->dentry, path->mnt, buf, &is_fuse)"
          chk fs/namei.c                                   "bool is_fuse = dentry->d_inode->i_sb->s_magic == FUSE_SUPER_MAGIC;"
          chk fs/namei.c                                   "filename_lookup() consumes fake_filename"
          chk fs/namei.c                                   "struct filename *old_name = nd->name;"
          chk fs/namespace.c                               "if (unlikely(is_mnt_ksu_unshared))"
          chk block/ioprio.c                               "susfs_is_priority_uid_filtered"
          chk kernel/sys.c                                 "susfs_is_priority_uid_filtered"
          chk include/linux/susfs.h                        "susfs_set_sus_path_uid_filter"
          chk include/linux/susfs_def.h                    "CMD_SUSFS_SET_SUS_PATH_UID_FILTER 0x55554"
          chk fs/susfs.c                                   "susfs_kernel_read"
          chk fs/susfs.c                                   "test_bit(AS_FLAGS_SUS_PATH, &inode->i_state)"
          chk fs/susfs.c                                   "msleep(1500);"
          chk fs/Makefile                                  "SUSFS_KERNEL_READ_NEW"
          if [ "$(grep -c 'susfs_is_priority_uid_filtered' block/ioprio.c)" -lt 3 ]; then fail "ioprio.c hooks incomplete"; fi
          if [ "$(grep -c 'susfs_is_priority_uid_filtered' kernel/sys.c)" -lt 3 ]; then fail "sys.c hooks incomplete"; fi
          find . -type f \( -name '*.rej' -o -name '*.orig' \) | grep . && fail "reject files found" || true
          echo "::endgroup::"
          echo "[+] SUSFS v2.4.0 + PRIORITY_UID_FILTER is ready."
