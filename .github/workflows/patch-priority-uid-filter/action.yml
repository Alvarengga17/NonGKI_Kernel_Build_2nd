name: 'Patch SUSFS v2.4.0 + PRIORITY_UID_FILTER (kernel side + BakaSU side).'
# Drop-in replacement for .github/workflows/patch-priority-uid-filter/action.yml
# Self-contained: this single file carries the v2.3.0 -> v2.4.0 kernel delta and the BakaSU patcher (gzip+base64, sha256-verified).
# Place it AFTER patch-susfs / patch-nomount / patch-baseband-guard (same position as before).

runs:
  using: 'composite'
  steps:
    - name: Patch SUSFS v2.4.0 + PRIORITY_UID_FILTER
      if: env.SUSFS_ENABLE == 'true' && env.SUSFS_PRIORITY_UID_FILTER == 'true'
      shell: bash
      run: |
          #!/usr/bin/env bash
          # Upgrades an existing SUSFS v2.3.0 kernel (Valeryn sm6115, android16-susfs-2.3.0) to SUSFS v2.4.0 (susfs_patch_to_4_19 "patch 1"),
          # enables CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER (kernel side is part of v2.4.0) and patches BakaSU (KernelSU side).
          # Idempotent. Any problem => exit 1 (the build stops here instead of producing a silently broken kernel).
          set -euo pipefail

          ACTION_DIR="$(mktemp -d)"
          echo "::group::[+] Unpack embedded patch files"
          base64 -d <<'B64_A' | gzip -dc > "$ACTION_DIR/susfs-v230-to-v240.patch"
