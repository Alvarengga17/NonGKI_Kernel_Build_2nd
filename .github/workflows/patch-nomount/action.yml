name: 'Patch NoMount for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch NoMount
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s

          echo "CONFIG_NOMOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          # Guard: stop early if the NoMount patch left rejected hunks
          mapfile -t REJ_FILES < <(find . -type f -name "*.rej")
          if [ ${#REJ_FILES[@]} -gt 0 ]; then
            for CAT_REJ in "${REJ_FILES[@]}"; do
              echo "[-] Found .rej file: $CAT_REJ"
              cat "$CAT_REJ"
              echo "[+] =================================== "
            done
            echo "[-] NoMount patch has rejected hunks, Stopped!"
            exit 1
          fi

          echo "[+] Patched NoMount for your kernel successfully."
