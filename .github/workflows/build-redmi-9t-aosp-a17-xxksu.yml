name: Build Redmi 9T (AOSP A17) (Kernel 4.19) - xxKSU + SUSFS (experimental)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "redmi_9t"
  DEVICE_CODENAME : "chime"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-unused-variable -Wno-error"

  KERNEL_SOURCE : "https://github.com/Alvarengga17/valeryn_xiaomi_sm6115.git"
  KERNEL_BRANCH : "android16-susfs-2.3.0"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/bengal-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # xxKSU (backslashxx) + jembatan SUSFS dari midori01. Memakai jalur manual, BUKAN auto-fork,
  # supaya workflow BakaSU tidak tersentuh. Nanti boleh diganti fork milikmu sendiri.
  KERNELSU_SOURCE : "https://github.com/midori01/KernelSU"
  KERNELSU_BRANCH : "xx"

  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "xxksu"
  # Cara xxKSU memasang hook ke kernel (pilih salah satu):
  #   branchlink    : CONFIG_KSU_HACK_ARM64_BRANCH_LINK (direkomendasikan xxKSU untuk 4.19+, butuh KALLSYMS)
  #   syscalltable  : CONFIG_KSU_TAMPER_SYSCALL_TABLE   (cadangan kalau branchlink bootloop/tidak jalan)
  XXKSU_HOOK_MODE : "branchlink"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false
  SUSFS_PRIORITY_UID_FILTER : true # Dipakai untuk memicu upgrade SUSFS kernel ke v2.4.0 (action patch-susfs-kernel-only).

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "aosp_a17_4.19_xxksu"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "manual" # shell, manual and only.

  PATCHES_SOURCE: "Alvarengga17/NonGKI_Kernel_Build_2nd" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mainline17" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "true" # if u need NoMount.
  FGETPRIORITY_ENABLE: "false" #if u need hide getpriority.
  VPNHIDE_ENABLE: "false" #if u need hide vpn status.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KPM_ENABLE: "false" # KPM hanya untuk SukiSU. Dimatikan; KALLSYMS diaktifkan di step xxKSU di bawah.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "true" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

  SKIP_CLEAN_HOOK: "true" # Wajib true (kernel sudah membawa SUSFS). Hook inline KSU dibuang oleh step "De-inline" di bawah.

jobs:
  build-kernel:
    name: Redmi 9T (AOSP A17) (Kernel 4.19) xxKSU
    runs-on: ubuntu-24.04 # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    container: ubuntu:focal # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready
                
      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs
                    
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      # Upgrade SUSFS kernel v2.3.0 -> v2.4.0 (tanpa bagian BakaSU)
      - name: 🧬 Upgrade SUSFS (kernel only)
        uses: ./.github/workflows/patch-susfs-kernel-only

      # Perbaiki penanda sus_path (set di i_state vs test di i_mapping->flags) supaya path benar-benar tersembunyi
      - name: 🩹 Fix SUSFS sus_path flag
        uses: ./.github/workflows/fix-susfs-sus-path-flag

      # Buang hook inline bergaya BakaSU; xxKSU memasang hook-nya sendiri
      - name: ✂️ De-inline KernelSU hooks
        uses: ./.github/workflows/patch-xxksu-deinline

      - name: 🪝 Set xxKSU hook method + KALLSYMS
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i '/^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=/d;/^CONFIG_KSU_TAMPER_SYSCALL_TABLE=/d;/^CONFIG_KALLSYMS=/d' "$DEFCONFIG"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          if [[ "${{ env.XXKSU_HOOK_MODE }}" == "syscalltable" ]]; then
            echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> "$DEFCONFIG"
          elif [[ "${{ env.XXKSU_HOOK_MODE }}" == "branchlink" ]]; then
            echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> "$DEFCONFIG"
          else
            echo "[-] XXKSU_HOOK_MODE must be branchlink or syscalltable"; exit 1
          fi
          grep -qE '^CONFIG_KSU_SUSFS_SUS_MAP=y' "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
          echo "[+] xxKSU hook mode: ${{ env.XXKSU_HOOK_MODE }}"
          grep -nE "CONFIG_KSU|CONFIG_KALLSYMS|THREAD_INFO_IN_TASK" "$DEFCONFIG"

      - name: 🧹 Hide dirty tag (cosmetic)
        shell: bash
        run: |
          KSU_DIR="$GITHUB_WORKSPACE/device_kernel/KernelSU"
          if [[ -d "$KSU_DIR/.git" ]]; then
            cd "$KSU_DIR"
            git diff HEAD --name-only -z | xargs -0 -r git update-index --assume-unchanged
            echo "[+] KernelSU version tag: $(git describe --tags --always --dirty)"
          else
            echo "[-] $KSU_DIR is not a git repo, Skipped."
          fi

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
