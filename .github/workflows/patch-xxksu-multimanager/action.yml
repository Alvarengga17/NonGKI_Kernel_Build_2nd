name: 'Add KernelSU-Next (KSUN) manager support to xxKSU.'
# Ports the ShockWave fork's manager-compat bits (MrShockWAVEog/KernelSU, branch shockwave) onto midori01 `xx`:
#   709a39b  KSUN signature + package (com.rifsxd.ksunext)            -> apk_sign.c / throne_tracker.c
#   ab4cf4a  KSUN version tag + hook mode ioctls (K,98 / K,99)         -> Makefile / ksu.h / supercall.h / dispatch.c
# Differences from the fork (on purpose):
#   - KSU_PACKAGE_NAME (me.weishu.kernelsu) and the official signature are KEPT (the fork removed them from the Makefile).
#   - Does NOT touch SUSFS / hooks. KowSU + MidoriSU need midori01's "driver info IOCTLs" (K,101/102/104) which
#     already live in `xx`; this action only verifies they are present.
# KowSU / MidoriSU / xxKSU are NOT changed (they already work). Only ONE manager is active at a time (kernel has a
# single manager appid): uninstall the active manager before opening another one.
# Env: KSUN_BUMP_VERSION (default false) -> keep KSU_VERSION exactly as `xx` ships it (32733), so the xxKSU/KowSU/MidoriSU
#      driver stays 100% as midori01 made it. Set "true" ONLY if KSUN still refuses after the signature/package fix
#      (reports 33554 / v3.4.2 like the ShockWave fork; affects all managers).
# Every edit must match exactly once, or already be applied (idempotent). Used by the xxKSU workflow only.

runs:
  using: 'composite'
  steps:
    - name: Multi-manager support
      shell: bash
      run: |
          set -euo pipefail
          KDIR="$GITHUB_WORKSPACE/device_kernel/KernelSU/kernel"
          [[ -d "$KDIR" ]] || { echo "[-] $KDIR not found"; exit 1; }
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then apt-get install -y python3 >/dev/null
            elif command -v pacman >/dev/null 2>&1; then pacman -S --noconfirm python >/dev/null
            fi
          fi
          MM="$(mktemp -d)"
          cat > "$MM/multimanager.py" <<'PYEOF'
          #!/usr/bin/env python3
          import re, sys, os

          root = sys.argv[1]          # .../KernelSU/kernel
          errors = 0
          changed = 0


          def rd(p):
              return open(os.path.join(root, p), encoding="utf-8", errors="surrogateescape").read()


          def wr(p, s):
              open(os.path.join(root, p), "w", encoding="utf-8", errors="surrogateescape").write(s)


          def edit(path, name, old, new, marker):
              """`old` literal must occur exactly once. If `marker` is already in the file -> already applied."""
              global errors, changed
              s = rd(path)
              if marker in s:
                  print(f"[=] {path}: {name} (already applied)")
                  return
              n = s.count(old)
              if n != 1:
                  errors += 1
                  print(f"[!] {path}: {name}: anchor matched {n}x (expected 1)")
                  return
              wr(path, s.replace(old, new, 1))
              changed += 1
              print(f"[+] {path}: {name}")


          # ---- 1. KSUN signature (apk_sign.c) -------------------------------------------------
          s = rd("manager/apk_sign.c")
          if "rifsxd/KernelSU-Next" in s:
              print("[=] manager/apk_sign.c: KSUN signature (already applied)")
          else:
              m = re.search(r"(bool is_manager_apk\(char \*path\)\s*\{.*?)(\n\treturn false;\n\})", s, flags=re.S)
              if not m:
                  errors += 1
                  print("[!] manager/apk_sign.c: is_manager_apk() not found")
              else:
                  add = ('\n\n\t// rifsxd/KernelSU-Next\n'
                         '\tif (check_v2_signature(path, 0x3e6, "79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7"))\n'
                         '\t\treturn true;\n')
                  s = s[:m.end(1)] + add + s[m.start(2):]
                  wr("manager/apk_sign.c", s)
                  changed += 1
                  print("[+] manager/apk_sign.c: KSUN signature")

          # ---- 2. KSUN package name (throne_tracker.c) ----------------------------------------
          edit("manager/throne_tracker.c", "KSUN package",
               '#define test_extra_pkgs(tgt) (is_kowsu_apk(tgt) || is_midorisu_apk(tgt))',
               '#define is_ksun_apk(tgt) extra_manager_apk(tgt, "com.rifsxd.ksunext")\n'
               '#define test_extra_pkgs(tgt) \\\n'
               '\t(is_kowsu_apk(tgt) || is_midorisu_apk(tgt) || is_ksun_apk(tgt))',
               "is_ksun_apk")

          # ---- 3. Version + tag (Makefile, ksu.h) ----------------------------------------------
          # KSUN manager v3.4.2 (33555) wants a kernel version >= 33554 (what the ShockWave fork reports).
          s = rd("Makefile")
          if os.environ.get("KSUN_BUMP_VERSION", "false").lower() != "true":
              print("[=] Makefile: version bump skipped (KSUN_BUMP_VERSION=false)")
          elif "KSU_VERSION_TAG" in s:
              print("[=] Makefile: version/tag (already applied)")
          else:
              n = len(re.findall(r"^CFLAGS_ksu\.o \+= -DKSU_VERSION=\d+[ \t]*$", s, flags=re.M))
              if n != 1:
                  errors += 1
                  print(f"[!] Makefile: -DKSU_VERSION line matched {n}x (expected 1)")
              else:
                  s = re.sub(r"^CFLAGS_ksu\.o \+= -DKSU_VERSION=\d+[ \t]*$",
                             "KSU_VERSION := 33554\nKSU_VERSION_TAG := v3.4.2\n"
                             "CFLAGS_ksu.o += -DKSU_VERSION=$(KSU_VERSION)\n"
                             "CFLAGS_ksu.o += -DKSU_VERSION_TAG=\\\"$(KSU_VERSION_TAG)\\\"",
                             s, count=1, flags=re.M)
                  wr("Makefile", s)
                  changed += 1
                  print("[+] Makefile: KSU_VERSION=33554, KSU_VERSION_TAG=v3.4.2")

          edit("include/ksu.h", "KERNEL_SU_VERSION_TAG",
               "#define KERNEL_SU_VERSION KSU_VERSION\n",
               "#define KERNEL_SU_VERSION KSU_VERSION\n#ifndef KSU_VERSION_TAG\n#define KSU_VERSION_TAG \"xx\"\n#endif\n#define KERNEL_SU_VERSION_TAG KSU_VERSION_TAG\n",
               "KERNEL_SU_VERSION_TAG")

          # ---- 4. ioctls K,98 (hook mode) / K,99 (version tag) ---------------------------------
          edit("include/uapi/supercall.h", "ioctl structs",
               "#define KSU_MARK_GET 1",
               "struct ksu_get_hook_mode_cmd {\n\tchar mode[16];\n};\n\n"
               "struct ksu_get_version_tag_cmd {\n\tchar tag[32];\n};\n\n"
               "#define KSU_MARK_GET 1",
               "struct ksu_get_hook_mode_cmd")
          edit("include/uapi/supercall.h", "ioctl numbers",
               "#define KSU_IOCTL_LOOKUP_SYMBOLS\t\t_IOW('K', 22, struct ksu_lookup_symbols_cmd)\n",
               "#define KSU_IOCTL_LOOKUP_SYMBOLS\t\t_IOW('K', 22, struct ksu_lookup_symbols_cmd)\n"
               "#define KSU_IOCTL_GET_HOOK_MODE\t\t_IOC(_IOC_READ, 'K', 98, 0)\n"
               "#define KSU_IOCTL_GET_VERSION_TAG\t_IOC(_IOC_READ, 'K', 99, 0)\n",
               "KSU_IOCTL_GET_HOOK_MODE")

          HANDLERS = r'''static int do_get_hook_mode(void __user *arg)
          {
          	struct ksu_get_hook_mode_cmd cmd = {0};
          	const char *type = "Manual";

          #ifdef CONFIG_KSU_KPROBES_KSUD
          	type = "Kprobes";
          #elif defined(CONFIG_KSU_TAMPER_SYSCALL_TABLE) || defined(CONFIG_KSU_HACK_ARM64_BRANCH_LINK)
          	type = "Hookless";
          #endif

          	strscpy(cmd.mode, type, sizeof(cmd.mode));

          	if (copy_to_user(arg, &cmd, sizeof(cmd))) {
          		pr_err("get_hook_mode: copy_to_user failed\n");
          		return -EFAULT;
          	}

          	return 0;
          }

          static int do_get_version_tag(void __user *arg)
          {
          	struct ksu_get_version_tag_cmd cmd = {0};

          	strscpy(cmd.tag, KERNEL_SU_VERSION_TAG, sizeof(cmd.tag));

          	if (copy_to_user(arg, &cmd, sizeof(cmd))) {
          		pr_err("get_version_tag: copy_to_user failed\n");
          		return -EFAULT;
          	}

          	return 0;
          }

          '''
          # the heredoc body is indented by the YAML block; strip that 10-space prefix from the C block
          HANDLERS = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in HANDLERS.split("\n"))

          edit("supercall/dispatch.c", "handlers",
               "static int do_nuke_ext4_sysfs(void __user *arg)",
               HANDLERS + "static int do_nuke_ext4_sysfs(void __user *arg)",
               "do_get_hook_mode")
          edit("supercall/dispatch.c", "ioctl table",
               "\t{ .cmd = 0, .name = NULL, .handler = NULL, .perm_check = NULL } // Sentinel",
               '\t{ .cmd = KSU_IOCTL_GET_HOOK_MODE, .name = "GET_HOOK_MODE", .handler = do_get_hook_mode, .perm_check = manager_or_root },\n'
               '\t{ .cmd = KSU_IOCTL_GET_VERSION_TAG, .name = "GET_VERSION_TAG", .handler = do_get_version_tag, .perm_check = manager_or_root },\n'
               "\t{ .cmd = 0, .name = NULL, .handler = NULL, .perm_check = NULL } // Sentinel",
               "KSU_IOCTL_GET_HOOK_MODE, .name")

          # ---- 5. sanity: things KowSU/MidoriSU need must already be in `xx` -------------------
          need = {
              "manager/throne_tracker.c": ["com.kowx712.supermanager", "com.midori.supermanager"],
              "include/uapi/supercall.h": ["KSU_IOCTL_HOOK_TYPE", "KSU_IOCTL_DRIVER_NAME", "KSU_IOCTL_SUSFS_VERSION"],
          }
          for f, keys in need.items():
              s = rd(f)
              for k in keys:
                  if k not in s:
                      errors += 1
                      print(f"[!] {f}: '{k}' missing -> this KernelSU commit is too old for KowSU/MidoriSU")
          if "me.weishu.kernelsu" not in rd("Makefile"):
              errors += 1
              print("[!] Makefile: KSU_PACKAGE_NAME (me.weishu.kernelsu) missing -> xxKSU manager would not be crowned")

          print(f"\nchanged={changed} errors={errors}")
          sys.exit(1 if errors else 0)
          PYEOF
          echo "::group::[+] Multi-manager (KSUN/KowSU/MidoriSU)"
          python3 -I "$MM/multimanager.py" "$KDIR"
          echo "::endgroup::"
          grep -nE "KSU_VERSION|KSU_PACKAGE_NAME :=" "$KDIR/Makefile"
